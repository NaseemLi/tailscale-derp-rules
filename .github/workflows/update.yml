name: 更新 DERP 规则集

on:
  workflow_dispatch:
  schedule:
    # 每天北京时间 05:00 (UTC 21:00) 自动运行
    - cron: "0 21 * * *"

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 生成规则文件
        run: python scripts/generate.py

      - name: 检查规则文件
        run: python scripts/check.py

      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rules/
          if git diff --cached --quiet; then
            echo "规则文件无变化，跳过提交。"
          else
            git commit -m "自动更新 DERP 规则集"
            git push
            echo "已提交并推送规则更新。"
          fi
